<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Forma3D · Editor 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f8;--panel:#fff;--text:#1d2330;--muted:#6b7385;--accent:#3b6fe0;--bd:#d9dde6;--btn:#eef0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1f222a;--text:#e8eaf0;--muted:#98a0b3;--accent:#6b9bff;--bd:#323744;--btn:#2a2e38}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1f222a;--text:#e8eaf0;--muted:#98a0b3;--accent:#6b9bff;--bd:#323744;--btn:#2a2e38}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header,.tl{display:flex;gap:6px;align-items:center;padding:7px 10px;background:var(--panel);overflow-x:auto;flex:none}
header{border-bottom:1px solid var(--bd)}.tl{border-top:1px solid var(--bd)}.tl input[type=range]{flex:1;min-width:120px}
header b{margin-right:6px;white-space:nowrap}.sp{flex:1}.sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
.side{width:190px;flex:none;background:var(--panel);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#L{border-right:1px solid var(--bd)}#R{border-left:1px solid var(--bd)}
h3{margin:8px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g button{padding:9px 4px}
#view{flex:1;min-width:0;position:relative}#view canvas{display:block;width:100%;height:100%}
label{display:flex;align-items:center;gap:8px;color:var(--muted)}label input[type=range]{flex:1;min-width:0}
input[type=color]{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;background:none;padding:2px}
#none{color:var(--muted);line-height:1.4}
#hint{padding:6px 12px;background:var(--panel);border-top:1px solid var(--bd);color:var(--muted);flex:none;min-height:18px}
#tip{position:fixed;display:none;max-width:240px;background:#10131a;color:#fff;padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.35;z-index:9;pointer-events:none;box-shadow:0 4px 14px #0005}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:9;max-width:90%;text-align:center}
@media(max-width:720px){main{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;max-height:30%;border:0!important;border-top:1px solid var(--bd)!important}#L{order:2}#R{order:3}#view{order:1}.g{display:flex;flex-wrap:wrap}h3{width:100%}}
</style></head><body><div id="app">
<header>
<b>🧊 Forma3D</b>
<button data-md="obj" data-tip="Modo Objeto: mueve, rota y escala objetos completos (Tab alterna con Edición)">▣ Objeto</button>
<button data-md="edit" data-tip="Modo Edición: modifica vértices, aristas y caras del objeto seleccionado (Tab)">✎ Edición</button>
<button data-md="sculpt" data-tip="Modo Escultura: moldea el objeto con un pincel, como si fuera arcilla">🖌 Escultura</button>
<span class="sep"></span>
<button id="undo" data-tip="Deshacer el último cambio (Ctrl+Z)">↶</button>
<button id="redo" data-tip="Rehacer (Ctrl+Y)">↷</button>
<button id="imp" data-tip="Abre un modelo .obj, .glb o .gltf y lo convierte en objetos editables">📂 Importar</button>
<button id="eobj" data-tip="Guarda la escena como OBJ (se guarda como .txt: cámbiale la extensión a .obj)">⬇ OBJ</button>
<button id="egl" data-tip="Guarda la escena como glTF (se guarda como .json: cámbiale la extensión a .gltf)">⬇ glTF</button>
<span class="sp"></span>
<button id="home" data-tip="Volver a la vista inicial (F)">🎯</button>
<input type="file" id="file" accept=".obj,.glb,.gltf" hidden>
</header>
<main>
<aside class="side" id="L">
<div data-for="obj"><h3>Añadir forma</h3><div class="g">
<button data-s="cubo" data-tip="Añade un cubo editable">⬛ Cubo</button><button data-s="esfera" data-tip="Añade una esfera editable">⚪ Esfera</button>
<button data-s="cilindro" data-tip="Añade un cilindro editable">🥫 Cilindro</button><button data-s="cono" data-tip="Añade un cono editable">🔺 Cono</button>
<button data-s="toro" data-tip="Añade un toro (dona) editable">🍩 Toro</button><button data-s="plano" data-tip="Añade un plano. Subdivídelo en Edición para esculpir terreno">▭ Plano</button></div></div>
<div data-for="obj"><h3>Luces y cámara</h3><div class="g">
<button data-l="point" data-tip="Luz puntual: ilumina en todas direcciones, como una bombilla. Muévela para ver cómo cambian las sombras">💡 Puntual</button>
<button data-l="sun" data-tip="Luz solar: ilumina todo desde una dirección, apuntando al centro de la escena">☀ Solar</button>
<button data-l="spot" data-tip="Foco: un cono de luz que apunta al centro de la escena">🔦 Foco</button>
<button id="addcam" data-tip="Añade una cámara. Muévela y rótala para encuadrar tu escena">🎥 Cámara</button>
<button id="camv" data-tip="Mira la escena a través de la cámara. Vuelve a pulsar para salir">👁 Ver cámara</button>
<button id="shot" data-tip="Guarda una imagen PNG de lo que ve la cámara (o de la vista actual si no hay cámara)">📷 Foto</button>
<button id="studio" class="on" data-tip="Activa o apaga la luz de estudio. Apágala para ver solo tus propias luces">🏠 Luz base</button></div></div>
<div data-for="obj edit"><h3>Transformar</h3><div class="g" id="modes">
<button class="on" data-m="translate" data-tip="Mover con las flechas de colores (G)">✥ Mover</button><button data-m="rotate" data-tip="Rotar con los círculos de colores (R)">⟳ Rotar</button>
<button data-m="scale" data-tip="Escalar con los cubitos (S)">⤢ Escalar</button><button id="snap" data-tip="Imán: movimientos en pasos exactos">🧲 Imán</button></div></div>
<div data-for="edit"><h3>Seleccionar</h3><div class="g" id="subs">
<button data-u="v" data-tip="Elegir vértices (puntos). Clic en un objeto cerca del punto. Shift suma (tecla 1)">• Vértice</button>
<button data-u="e" data-tip="Elegir aristas (líneas). Shift suma (tecla 2)">╱ Arista</button>
<button data-u="f" class="on" data-tip="Elegir caras (superficies). Shift suma (tecla 3)">◼ Cara</button>
<button id="all" data-tip="Selecciona todo el objeto (A)">Todo</button></div>
<h3>Herramientas</h3><div class="g">
<button id="ext" data-tip="Extruir: crea volumen empujando las caras elegidas hacia afuera (E)">⇪ Extruir</button>
<button id="ins" data-tip="Inset: crea un marco más pequeño dentro de cada cara elegida (I)">▣ Inset</button>
<button id="sub1" data-tip="Subdividir: divide cada cara en 4 para tener más detalle">✚ Dividir</button>
<button id="sub2" data-tip="Subdividir suave: divide y redondea la forma, como en Blender">◔ Dividir suave</button>
<button id="delf" data-tip="Borra las caras elegidas (X)">✖ Borrar caras</button>
<button id="bev" data-tip="Biselar: redondea o achaflana las aristas elegidas (B). Elige aristas en modo Arista, o una cara completa">◩ Biselar</button></div>
<label data-tip="Ancho del bisel: qué tan grande es el corte en la arista">Ancho<input type="range" id="bw" min=".02" max=".4" step=".01" value=".12"></label></div>
<div data-for="sculpt"><h3>Pincel</h3><div class="g" id="tools">
<button data-t="inf" class="on" data-tip="Inflar: empuja la superficie hacia afuera donde pintas">⬆ Inflar</button>
<button data-t="def" data-tip="Hundir: empuja la superficie hacia adentro">⬇ Hundir</button>
<button data-t="smo" data-tip="Suavizar: alisa bultos y aristas">≈ Suavizar</button></div>
<label data-tip="Tamaño del pincel">Radio<input type="range" id="rad" min=".1" max="1.5" step=".05" value=".5"></label>
<label data-tip="Fuerza del pincel">Fuerza<input type="range" id="str" min=".1" max="1" step=".05" value=".5"></label>
<div id="none2" style="color:var(--muted)">Consejo: en Edición usa “Dividir” varias veces para tener más puntos que esculpir.</div></div>
</aside>
<div id="view"></div>
<aside class="side" id="R">
<h3>Objeto</h3><div id="none">Haz clic en un objeto para editarlo.</div>
<div id="props" style="display:none;flex-direction:column;gap:8px">
<input type="color" id="col" data-tip="Color del objeto seleccionado">
<div data-for="obj"><label data-tip="Ancho (eje X)">X<input type="range" id="sx" min=".1" max="5" step=".05"></label>
<label data-tip="Alto (eje Y)">Y<input type="range" id="sy" min=".1" max="5" step=".05"></label>
<label data-tip="Profundidad (eje Z)">Z<input type="range" id="sz" min=".1" max="5" step=".05"></label></div>
<div id="modbox" style="display:flex;flex-direction:column;gap:8px"><label data-tip="Suavizado: la superficie se ve redonda en vez de facetada"><input type="checkbox" id="sm">Suavizado</label>
<h3>Modificadores</h3>
<label data-tip="Espejo: crea una copia reflejada en el eje X, ideal para modelar personajes simétricos"><input type="checkbox" id="mir">Espejo X</label>
<label data-tip="Arreglo: repite el objeto en fila. Elige cuántas copias">Copias<input type="range" id="arn" min="1" max="10" step="1"></label>
<label data-tip="Separación entre las copias del arreglo">Espacio<input type="range" id="aro" min=".2" max="5" step=".1"></label></div>
<div id="litbox" style="display:none"><label data-tip="Intensidad: qué tan fuerte brilla la luz">Intensidad<input type="range" id="lint" min="0" max="4" step=".05"></label></div>
<div data-for="obj" style="display:flex;flex-direction:column;gap:8px">
<button id="dup" data-tip="Copia el objeto (Shift+D)">⧉ Duplicar</button><button id="del" data-tip="Borra el objeto (Supr). Puedes deshacer">🗑 Eliminar</button></div>
</div></aside>
</main>
<div class="tl"><button id="play" data-tip="Reproduce la animación entre las claves (Espacio)">▶ Reproducir</button>
<input type="range" id="fr" min="0" max="120" step="1" value="0" data-tip="Línea de tiempo: arrastra para ir a otro fotograma"><span id="frl" style="min-width:90px">Fotograma 0</span>
<button id="key" data-tip="Guarda la posición, rotación y tamaño actuales del objeto en este fotograma (K). Crea 2 claves en fotogramas distintos para animar">◆ Insertar clave</button>
<button id="ukey" data-tip="Borra la clave del objeto en este fotograma">◇ Quitar</button><span id="kl" style="color:var(--muted)"></span></div>
<div id="hint"></div></div>
<div id="tip"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
const $=s=>document.querySelector(s),V3=THREE.Vector3;
const DEFS={obj:"Clic: seleccionar · Arrastrar: girar la vista · Clic derecho: desplazar · Tab: modo edición",edit:"Clic: elegir vértice, arista o cara (Shift suma) · E extruir · Tab: volver a Objeto",sculpt:"Arrastra sobre el objeto para esculpir · Si cuesta moldearlo, usa Edición › Dividir antes"};
let W=1,H=1,camV=false,mode="obj",sel=null,cur=null,hist=[],hi=-1,selV=new Set(),sub="f",tool="inf",frame=0,playing=false,sc=null,drag=null,down=null;
const dark=matchMedia("(prefers-color-scheme: dark)").matches,EC=dark?0x8a93a6:0x2a303c,VC=dark?[.85,.85,.9]:[.1,.1,.12];
const view=$("#view"),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(dark?0x1b1d22:0xe9ecf1);
const cam=new THREE.PerspectiveCamera(50,1,.1,500);
const hemi=new THREE.HemisphereLight(0xffffff,0x667788,.85),sun=new THREE.DirectionalLight(0xffffff,.9);scene.add(hemi);sun.position.set(5,8,4);scene.add(sun);
const grid=new THREE.GridHelper(20,20,dark?0x666b77:0x8899aa,dark?0x333741:0xc5ccd6);scene.add(grid);
const world=new THREE.Group();scene.add(world);const lightsG=new THREE.Group();scene.add(lightsG);
const orbit=new THREE.OrbitControls(cam,renderer.domElement);orbit.enableDamping=true;
const tc=new THREE.TransformControls(cam,renderer.domElement);scene.add(tc);
const pivot=new THREE.Object3D();scene.add(pivot);
const box=new THREE.BoxHelper(new THREE.Object3D(),0xffb020);box.visible=false;scene.add(box);
function home(){cam.position.set(4,3.5,5);orbit.target.set(0,.5,0);orbit.update()}home();
function resize(){const w=view.clientWidth,h=view.clientHeight;W=w;H=h;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);resize();
const clk=new THREE.Clock();
// ---- cubo de orientación ----
const gs=new THREE.Scene(),gcam=new THREE.PerspectiveCamera(30,1,.1,20),GS=110;
const gtex=(t,c)=>{const k=document.createElement("canvas");k.width=k.height=128;const x=k.getContext("2d");x.fillStyle=c;x.fillRect(0,0,128,128);x.strokeStyle="#fff8";x.lineWidth=6;x.strokeRect(0,0,128,128);x.fillStyle="#fff";x.font="bold 25px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(t,64,64);return new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(k)})};
const gcube=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),[["Derecha","#c0504d"],["Izquierda","#8a3b39"],["Arriba","#5aa04b"],["Abajo","#3f7335"],["Frente","#4a7bd0"],["Atrás","#365a9a"]].map(a=>gtex(...a)));gs.add(gcube);
function drawGizmo(){gcam.position.copy(cam.position).sub(orbit.target).normalize().multiplyScalar(5);gcam.quaternion.copy(cam.quaternion);
 renderer.autoClear=false;renderer.clearDepth();renderer.setScissorTest(true);renderer.setViewport(W-GS-10,H-GS-10,GS,GS);renderer.setScissor(W-GS-10,H-GS-10,GS,GS);renderer.render(gs,gcam);renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);renderer.autoClear=true}
function inGizmo(e){if(camV)return false;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return x>W-GS-10&&x<W-10&&y>10&&y<GS+10}
function gizmoClick(e){if(!inGizmo(e))return false;const r=cv.getBoundingClientRect();mv.set(((e.clientX-r.left-(W-GS-10))/GS)*2-1,-(((e.clientY-r.top-10)/GS)*2-1));ray.setFromCamera(mv,gcam);const h=ray.intersectObject(gcube)[0];
 if(h){const n=h.face.normal.clone(),d=cam.position.distanceTo(orbit.target);cam.position.copy(orbit.target).addScaledVector(n,d);if(Math.abs(n.y)>.9)cam.position.z+=.001;orbit.update()}return true}
function activeCam(){const c=lightsG.children.find(m=>m.userData.cam);return c&&c.userData.pc}
function marks(v){lightsG.children.forEach(m=>m.material.visible=v)}
(function loop(){requestAnimationFrame(loop);const dt=clk.getDelta();if(playing)setFrame(frame+dt*24>120?0:frame+dt*24);orbit.update();if(sel&&mode==="obj")box.update();const ac=camV&&activeCam();if(ac){ac.aspect=W/H;ac.updateProjectionMatrix();renderer.render(scene,ac)}else{renderer.render(scene,cam);drawGizmo()}})();
// ---- geometría ----
const avg=l=>[0,1,2].map(c=>l.reduce((s,p)=>s+p[c],0)/l.length),ek=(a,b)=>a<b?a+"_"+b:b+"_"+a,d2=(a,p)=>(a[0]-p.x)**2+(a[1]-p.y)**2+(a[2]-p.z)**2;
function newell(P,f){let x=0,y=0,z=0;for(let i=0;i<f.length;i++){const a=P.v[f[i]],b=P.v[f[(i+1)%f.length]];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}return[x,y,z]}
const nz=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
function buildGeo(P,smooth){const pos=[],nor=[],tf=[],vn=P.v.map(()=>[0,0,0]),fn=P.f.map(f=>{const n=newell(P,f);f.forEach(i=>{vn[i][0]+=n[0];vn[i][1]+=n[1];vn[i][2]+=n[2]});return nz(n)});
 P.f.forEach((f,fi)=>{for(let k=1;k<f.length-1;k++)[f[0],f[k],f[k+1]].forEach(i=>{pos.push(...P.v[i]);nor.push(...(smooth?nz(vn[i]):fn[fi]));if(i===f[0])tf.push(fi)})});
 const tri=[];P.f.forEach((f,fi)=>{for(let k=1;k<f.length-1;k++)tri.push(fi)});
 const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));geo.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));return{geo,tf:tri}}
function mk(p,c){const m=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshStandardMaterial({color:c,roughness:.55,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));m.userData={poly:p,keys:{},mods:{mirror:false,n:1,off:1.5},smooth:false};rebuild(m);return m}
function rebuild(m){const{geo,tf}=buildGeo(m.userData.poly,m.userData.smooth);m.geometry.dispose();m.geometry=geo;m.userData.tf=tf;
 m.children.filter(c=>c.userData.mod).forEach(c=>m.remove(c));const d=m.userData.mods;
 if(mode!=="edit")for(let i=0;i<d.n;i++)for(let s=0;s<(d.mirror?2:1);s++){if(!i&&!s)continue;const c=new THREE.Mesh(geo,m.material);c.userData.mod=1;c.position.x=(s?-1:1)*i*d.off;c.scale.x=s?-1:1;m.add(c)}}
function orient(v,f,cf){f.forEach(fc=>{const n=newell({v},fc),c=avg(fc.map(j=>v[j])),o=cf(c);if(n[0]*(c[0]-o[0])+n[1]*(c[1]-o[1])+n[2]*(c[2]-o[2])<0)fc.reverse()})}
function prim(t){const v=[],f=[],n=16,rg=[...Array(n).keys()];
 if(t==="cubo"){for(const z of[-.5,.5])for(const[x,y]of[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]])v.push([x,y,z]);f.push([4,5,6,7],[1,0,3,2],[5,1,2,6],[0,4,7,3],[7,6,2,3],[0,1,5,4])}
 else if(t==="plano"){v.push([-1,0,1],[1,0,1],[1,0,-1],[-1,0,-1]);f.push([0,1,2,3])}
 else if(t==="cilindro"||t==="cono"){const cone=t==="cono";rg.forEach(i=>{const a=i/n*6.2832;v.push([.5*Math.cos(a),-.5,.5*Math.sin(a)])});
  if(cone)v.push([0,.5,0]);else rg.forEach(i=>{const a=i/n*6.2832;v.push([.5*Math.cos(a),.5,.5*Math.sin(a)])});
  rg.forEach(i=>{const j=(i+1)%n;f.push(cone?[j,i,n]:[j,i,n+i,n+j])});f.push([...rg]);if(!cone)f.push(rg.map(i=>2*n-1-i))}
 else if(t==="esfera"){const L=8,S=12;v.push([0,.5,0],[0,-.5,0]);for(let k=1;k<L;k++)for(let i=0;i<S;i++){const p=Math.PI*k/L,a=i/S*6.2832;v.push([.5*Math.sin(p)*Math.cos(a),.5*Math.cos(p),.5*Math.sin(p)*Math.sin(a)])}
  const r=(k,i)=>2+(k-1)*S+i%S;for(let i=0;i<S;i++){f.push([0,r(1,i),r(1,i+1)],[1,r(L-1,i+1),r(L-1,i)]);for(let k=1;k<L-1;k++)f.push([r(k,i),r(k+1,i),r(k+1,i+1),r(k,i+1)])}orient(v,f,()=>[0,0,0])}
